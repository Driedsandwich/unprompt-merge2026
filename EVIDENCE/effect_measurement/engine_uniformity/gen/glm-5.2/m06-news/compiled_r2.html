<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社内報 巻頭あいさつ</title>
<style>
:root {
  --base: #fff6e8;
  --primary: #c4472b;
  --accent: #e8965a;
  --text: #3a2820;
  --soft: #faf2e6;
}

/* GYAKUMON-CHOICE: 「堅すぎない」の具体的な温度感 = 親しみ雑談調 */
/* GYAKUMON-CHOICE: あいさつの主題・切り口 = 近況・季節雑談 */
/* GYAKUMON-CHOICE: 書き手の立場 = 現場社員目線 */
/* GYAKUMON-CHOICE: 読み手との距離感 = 部署間温度差配慮 */

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--base);
  font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
  color: var(--text);
  line-height: 1.95;
  -webkit-font-smoothing: antialiased;
  padding: 24px;
}

.page {
  max-width: 720px;
  margin: 0 auto;
  background: var(--soft);
  border-radius: 16px;
  padding: 64px 64px 56px;
}

.greeting-block {
  margin-bottom: 40px;
}

.greeting-block p {
  font-size: 17px;
  letter-spacing: 0.04em;
}

.section {
  margin-bottom: 32px;
}

.section-label {
  font-size: 13px;
  letter-spacing: 0.14em;
  color: var(--primary);
  margin-bottom: 12px;
  font-weight: 700;
}

.section p {
  font-size: 16px;
  letter-spacing: 0.03em;
  line-height: 1.95;
}

.closing {
  margin-top: 8px;
  padding-top: 24px;
  border-top: 1px solid #e8d8c4;
}

.closing p {
  font-size: 16px;
  letter-spacing: 0.03em;
}

.signoff {
  margin-top: 40px;
  text-align: right;
}

.signoff p {
  font-size: 14px;
  letter-spacing: 0.06em;
  color: var(--accent);
}
</style>
</head>
<body>
<div class="page">

  <!-- GYAKUMON-CHOICE: 読み手との距離感 = 部署間温度差配慮 -->
  <div class="greeting-block">
    <p>各部署のみなさん、おつかれさまです。今月もそれぞれのペースで走り続けてくださり、ありがとうございます。</p>
  </div>

  <!-- GYAKUMON-CHOICE: あいさつの主題・切り口 = 近況・季節雑談 -->
  <div class="section">
    <p>今日も蒸し暑いですね。先日、帰り道でふと寄った店で食べた冷やし中華が思ったより美味しくて、それ以来すっかりハマっています。みなさん、最近「これいいぞ」と思うもの、ありますか？</p>
  </div>

  <!-- GYAKUMON-CHOICE: 「堅すぎない」の具体的な温度感 = 親しみ雑談調 -->
  <!-- GYAKUMON-CHOICE: 書き手の立場 = 現場社員目線 -->
  <div class="section">
    <p>今月の社内報も、現場の息抜きになるような内容を揃えました。特集やトピックをざっと眺めて、気になるところから気楽にどうぞ。毎日の業務の合間に、少し肩の力が抜ける時間になれば嬉しいです。</p>
  </div>

  <div class="closing section">
    <p>今月もよろしくお願いします。〈確認: 今月号の特集・話題があればここに1行〉</p>
  </div>

  <div class="signoff">
    <p>〈確認: 発行者名または役職名〉</p>
  </div>

</div>
</body>
</html>
