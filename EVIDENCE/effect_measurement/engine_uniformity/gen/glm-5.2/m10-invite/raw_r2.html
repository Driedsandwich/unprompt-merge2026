<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同窓会のご案内</title>
<style>
  :root {
    --bg: #f4ede0;
    --ink: #2b3a4a;
    --accent: #d4622a;
    --body-size: 15px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    font-size: var(--body-size);
    line-height: 1.85;
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
    padding: 64px 24px;
  }
  .sheet {
    max-width: 720px;
    margin: 0 auto;
  }
  .opener {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Hiragino Mincho", serif;
    font-size: 30px;
    font-weight: 600;
    line-height: 1.55;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }
  .opener-sub {
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 80px;
  }
  .intro {
    margin-bottom: 88px;
  }
  .intro p {
    margin-bottom: 16px;
  }
  .intro p:last-child {
    margin-bottom: 0;
  }
  .outline {
    margin-bottom: 88px;
  }
  .outline dt {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
    margin-top: 24px;
  }
  .outline dt:first-of-type { margin-top: 0; }
  .outline dd {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .vibe {
    margin-bottom: 88px;
    padding-left: 20px;
  }
  .vibe p {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Hiragino Mincho", serif;
    font-size: 16px;
    line-height: 1.9;
    letter-spacing: 0.02em;
  }
  .reply {
    margin-bottom: 80px;
    font-size: 14px;
  }
  .reply .label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .closing {
    border-top: 1px solid rgba(43, 58, 74, 0.15);
    padding-top: 40px;
    font-size: 13px;
    line-height: 2.1;
  }
  .closing span {
    display: block;
  }
  .sig {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Hiragino Mincho", serif;
    font-size: 14px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="sheet">

    <p class="opener-sub">同窓会のご案内</p>
    <h1 class="opener">久しぶり。<br>顔を見よう。</h1>

    <section class="intro">
      <p>あれから何年経ったかな。各自バタバタしてるのは百も承知で、声をかけました。</p>
      <p>特に大きな催しではありません。久しぶりに集まって、近況を肴にごはんでも食べるだけの会です。</p>
    </section>

    <section class="vibe">
      <p>持ち帰りは「またやろう」の一言だけで十分。気負わず、当日の都合で来て、帰ってください。</p>
    </section>

    <dl class="outline">
      <dt>開催日</dt>
      <dd>〈開催日〉</dd>
      <dt>時間</dt>
      <dd>〈開始時間〉頃 〜</dd>
      <dt>会場</dt>
      <dd>〈会場〉</dd>
      <dt>会費</dt>
      <dd>〈会費〉程度</dd>
    </dl>

    <div class="reply">
      <p class="label">出欠の連絡</p>
      <p>〈締切〉までに、〈幹事名〉までお知らせください。当日の急な参加も歓迎です。</p>
    </div>

    <div class="closing">
      <span>幹事 〈幹事名〉</span>
      <span class="sig">返信を待ってます。</span>
    </div>

  </div>
</body>
</html>
