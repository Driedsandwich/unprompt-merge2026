<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Unprompt — Intent Compiler">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ECEAE4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" fill="#FCFCFA"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <!-- 圏点(未決の朱)がワードマークの Un に打たれる -->
  <circle cx="332" cy="96" r="4" fill="#C73E2E"/>
  <circle cx="376" cy="96" r="4" fill="#C73E2E"/>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="600" letter-spacing="6">
    <text x="320" y="158" font-size="64">
      <tspan fill="#C73E2E">Un</tspan><tspan fill="#2B3A67">prompt</tspan>
    </text>
    <text x="668" y="158" font-size="22" fill="#8E8C86" letter-spacing="4">— Intent Compiler</text>
  </g>
  <!-- 引出線(製図) -->
  <path d="M 354 108 L 354 196 L 846 196" fill="none" stroke="#C73E2E" stroke-opacity=".5" stroke-width="1"/>
  <circle cx="354" cy="108" r="2.2" fill="#C73E2E" fill-opacity=".7"/>
  <g font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="21" fill="#1C1B18">
    <text x="320" y="228">AIは、あなたの成果物を書かない。あなたの意図だけを書かせる。</text>
  </g>
</svg>
