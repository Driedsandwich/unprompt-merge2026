<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="曖昧な一文 → 爆散(3〜5の判断点) → 決める/委ねる(クリックのみ) → 意図の指示書(JSON) → いつものAIへ">
