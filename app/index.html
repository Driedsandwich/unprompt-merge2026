<!doctype html>
<!--
  GYAKUMON — Intent Compiler / 製品UI (app/index.html)

  配信: server.py が本ディレクトリを / で配信する。
      python3 server.py  →  http://127.0.0.1:8765/
  file:// 直開き不可(/api/* が無いため)。

  構成: 単一ファイル・バニラJS・外部依存ゼロ(CDN/フォント/画像/WebSocket なし)。

  製品憲法(このファイルが守る規律):
    1. AIはユーザーの成果物を書かない。人間は最初の一文以降タイプしない。
       操作は〈決める〉(オプションのミニレンダをクリック)と〈委ねる〉(カードのボタン)の2動詞のみ。
    2. 画面遷移 (a)平凡なプロンプト箱 → (b)静寂(実測経過秒 + 「x1.0 — 生成は、始まらない」)
       → (c)爆散(語スパン分解 + SVGテザー) → (d)カード操作 → (e)N=0でコンパイル → (f)コンパイル画面。
    3. カード最大5枚。ミニレンダは /api/render の tokens から決定論描画。
       レンダ未着はラベル+スケルトン(白紙カード禁止)。render は並列 fetch、到着順に着地。
    4. ポインタがカード近傍に入ったらレイアウト凍結(既存カードを動かさない)。
    5. サイドパネル・%メーター・BGM・パーティクル禁止。状態は「原文の語の色」と「カウンタ」のみ。
    6. 確定/委任済みの語をクリックすると当該カードを再提示して再選択(状態上書き)。多段アンドゥなし。
    7. 静かで上質。ニュートラル + 確定色(藍) + 委任グレー。

  サーバ由来の文字列は必ず textContent で挿入する(innerHTML は静的マークアップのみ)。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GYAKUMON — Intent Compiler</title>
<!-- favicon への外部リクエスト(404)を止める。外部依存ゼロを保つための空データURI。 -->
<link rel="icon" href="data:,">
<style>
  :root{
    --paper:#faf9f7;
    --card:#ffffff;
    --ink:#22252a;
    --ink-soft:#4a4f57;
    --muted:#8b8f96;
    --line:#e4e2dd;
    --line-soft:#efede8;
    --decided:#2a4a7f;              /* 確定色(藍) */
    --decided-bg:rgba(42,74,127,.09);
    --delegate:#9aa0a6;             /* 委任グレー */
    --delegate-bg:rgba(154,160,166,.14);
    --danger:#9a2b2b;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"palt" 1;
  }
  button{font-family:inherit; color:inherit; cursor:pointer}
  :focus-visible{outline:2px solid var(--decided); outline-offset:2px; border-radius:4px}

  /* ============ (a) 初期画面: 見慣れたプロンプト箱だけ ============ */
  #screenInitial{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px;
  }
  #promptBox{
    width:100%; max-width:660px; background:#fff;
    border:1px solid var(--line); border-radius:16px;
    box-shadow:0 1px 2px rgba(30,25,15,.03), 0 8px 24px rgba(30,25,15,.045);
    padding:14px 14px 10px; transition:opacity .45s ease, transform .45s ease;
  }
  #promptBox.leaving{opacity:0; transform:translateY(-8px)}
  #briefInput{
    width:100%; border:0; resize:none; outline:none; background:transparent;
    font-family:inherit; font-size:16px; line-height:1.75; color:var(--ink);
    max-height:220px; overflow-y:auto; padding:4px 4px 0;
  }
  #briefInput::placeholder{color:#b4b7bb}
  .prompt-foot{display:flex; align-items:center; justify-content:flex-end; gap:10px; padding-top:6px}
  #btnSend{
    width:32px; height:32px; border-radius:50%; border:0;
    background:var(--ink); color:#fff; font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .2s ease;
  }
  #btnSend:disabled{opacity:.22; cursor:default}
  #healthNote{
    margin-top:14px; font-size:12px; color:var(--danger); text-align:center; max-width:660px;
  }

  /* ============ ステージ(静寂 → 爆散 → カード) ============ */
  #screenStage{max-width:1000px; margin:0 auto; padding:56px 24px 96px}
  #stage{position:relative}

  #tethers{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:visible}

  #briefText{
    position:relative; z-index:1;
    white-space:pre-wrap; word-break:break-word;
    font-size:22px; line-height:2.15; letter-spacing:.01em;
    color:var(--ink); max-width:820px; margin:0 auto;
    transition:font-size .4s ease;
  }
  /* 語スパン: 爆散前は原文と同じ見た目、爆散で割れて間隔が開く */
  .tok{
    display:inline-block; position:relative;
    padding:.02em .1em; margin:0; border-radius:3px;
    background:transparent; color:inherit;
    transition:margin .55s cubic-bezier(.19,.9,.25,1),
               transform .55s cubic-bezier(.19,.9,.25,1),
               background-color .3s ease, color .3s ease, box-shadow .3s ease;
  }
  #stage.exploded .tok{margin:0 .3em; transform:translateY(-1px)}
  #stage.exploded .tok[data-state="open"]{
    background:rgba(34,37,42,.045);
    box-shadow:inset 0 -1px 0 rgba(34,37,42,.22);
    cursor:default;
  }
  #stage.exploded .tok[data-state="decided"]{
    background:var(--decided-bg); color:var(--decided);
    box-shadow:inset 0 -1.5px 0 var(--decided); cursor:pointer;
  }
  #stage.exploded .tok[data-state="delegated"]{
    background:var(--delegate-bg); color:var(--delegate);
    box-shadow:inset 0 -1.5px 0 var(--delegate); cursor:pointer;
  }
  #stage.exploded .tok.hl{background:rgba(42,74,127,.16)}

  /* 静寂カウンタ / 判断点カウンタ */
  #meta{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:20px; margin:34px auto 0; max-width:820px; position:relative; z-index:1;
  }
  #silence{flex:1; text-align:center; transition:none}
  #silence #silenceNum{
    font-size:30px; font-variant-numeric:tabular-nums; color:var(--ink-soft);
    letter-spacing:.02em; font-weight:300;
  }
  #silence #silenceNum .u{font-size:15px; color:var(--muted); margin-left:2px}
  #silence #silenceNote{font-size:10.5px; color:var(--muted); letter-spacing:.08em; margin-top:8px}
  #silence.done{flex:0 0 auto; text-align:left}
  #silence.done #silenceNum{display:inline; font-size:11px; color:var(--muted); font-weight:400}
  #silence.done #silenceNum .u{font-size:11px}
  #silence.done #silenceNote{display:inline; margin:0 0 0 8px; font-size:10.5px}
  #branchCounter{
    font-size:12.5px; color:var(--ink-soft); letter-spacing:.06em;
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  #branchCounter b{font-weight:600; font-size:15px; color:var(--decided)}
  #branchCounter.zero b{color:var(--ink)}
  #assessNote{
    max-width:820px; margin:26px auto 0; font-size:13px; line-height:1.9;
    color:var(--muted); position:relative; z-index:1;
  }
  #stageError{
    max-width:820px; margin:26px auto 0; padding:14px 16px; position:relative; z-index:1;
    border:1px solid rgba(154,43,43,.3); border-radius:10px; background:rgba(154,43,43,.045);
    font-size:13px; line-height:1.85; color:var(--danger);
  }
  #stageError .hint{color:var(--ink-soft); display:block; margin-top:4px}
  #stageError button{
    margin-top:10px; background:transparent; border:1px solid var(--line);
    border-radius:8px; padding:5px 12px; font-size:12px; color:var(--ink-soft);
  }

  /* ============ 分岐カード(原文の下・2列グリッド) ============ */
  #cards{
    display:grid; grid-template-columns:1fr 1fr; gap:20px;
    margin-top:46px; position:relative; z-index:1;
  }
  #cards .card:nth-child(odd):last-child{grid-column:1 / -1; justify-self:center; width:calc(50% - 10px)}
  /* ストリーミング中は「最後の1枚を中央に寄せる」規則を止める。
     到着のたびに last-child が移り変わり、既に置いたカードが動いてしまうため
     (条項4: 既存カードを動かさない)。done で class を外すと、その時点の
     最終カード(= 直前に追加したばかりで、まだフェードイン前の1枚)だけに規則が効く。 */
  #cards.streaming .card:nth-child(odd):last-child{grid-column:auto; justify-self:auto; width:auto}
  /* 到着した1枚だけをフェードインさせる。#cards.in が既に付いた後に追加された
     カードは、pending を1フレーム挟まないと遷移せず突然現れる。 */
  #cards.in .card.pending{opacity:0; transform:translateY(8px)}
  @media (max-width:760px){
    #cards{grid-template-columns:1fr}
    #cards .card:nth-child(odd):last-child{width:100%}
    #cards.streaming .card:nth-child(odd):last-child{width:100%}
    #briefText{font-size:19px}
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 16px 14px; display:flex; flex-direction:column;
    box-shadow:0 1px 2px rgba(30,25,15,.03);
    opacity:0; transform:translateY(8px);
    transition:opacity .5s ease, transform .5s ease, border-color .25s ease, box-shadow .25s ease;
    border-left:3px solid var(--line);
  }
  #cards.in .card{opacity:1; transform:none}
  .card.near{box-shadow:0 1px 2px rgba(30,25,15,.03), 0 6px 20px rgba(30,25,15,.06)}
  .card[data-state="decided"]{border-left-color:var(--decided)}
  .card[data-state="delegated"]{border-left-color:var(--delegate)}
  .card.editing{border-color:var(--decided)}
  .card.flash{border-color:var(--decided)}
  .card .q{font-size:14.5px; line-height:1.65; font-weight:600; color:var(--ink)}
  .card .impact{font-size:11.5px; line-height:1.75; color:var(--muted); margin-top:6px}
  .card .opts{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px}
  .opt{
    background:transparent; border:1px solid transparent; border-radius:10px;
    padding:5px 5px 6px; margin:0; display:block; text-align:left;
    transition:border-color .2s ease, background-color .2s ease;
  }
  .opt:hover{border-color:var(--line); background:#fcfbfa}
  .opt[aria-pressed="true"]{border-color:var(--decided); background:var(--decided-bg)}
  .olabel{
    font-size:11.5px; line-height:1.5; color:var(--ink-soft); margin-top:6px;
    width:120px; word-break:break-word;
  }
  .card-foot{margin-top:auto; padding-top:14px; display:flex; justify-content:flex-end}
  .delegate{
    background:transparent; border:1px solid var(--line); border-radius:8px;
    padding:5px 14px; font-size:12px; color:var(--muted); letter-spacing:.04em;
    transition:color .2s ease, border-color .2s ease;
  }
  .delegate:hover{color:var(--ink-soft); border-color:var(--muted)}
  /* 決定表示はクリックで再提示できる(条項6の保証。原文の語が無い分岐への保険も兼ねる) */
  .resolved{display:flex; align-items:flex-start; gap:14px; margin-top:14px; cursor:pointer}
  .resolved .rtext{font-size:12.5px; line-height:1.8; color:var(--ink-soft); padding-top:2px}
  .resolved .rtext .rkind{display:block; font-size:10.5px; letter-spacing:.1em; color:var(--muted); margin-bottom:3px}
  .resolved .rtext .rhint{display:block; font-size:10.5px; color:var(--muted); margin-top:8px; line-height:1.7}
  /* 決定表示が選択肢表示より高くならないよう行数を固定する。
     カード高さは爆散時に最大値で固定済みなので、これで既存カードは決して動かない。 */
  .resolved .rtext strong{
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden;
  }
  .card[data-state="decided"] .resolved .rtext strong{color:var(--decided); font-weight:600}
  .card[data-state="delegated"] .resolved .rtext strong{color:var(--delegate); font-weight:600}

  /* ============ 決定論ミニレンダ(120x84) ============ */
  .mini{
    width:120px; height:84px; overflow:hidden; flex:0 0 auto;
    border:1px solid rgba(34,37,42,.11); border-radius:10px;
    display:flex; flex-direction:column; background:#fff;
  }
  .mini-band{display:flex; height:13px; flex:0 0 auto}
  .mini-band div{height:100%}
  .mini-body{flex:1; min-height:0; display:flex; flex-direction:column}
  .mini-textwrap{flex:1; min-height:0; overflow:hidden}
  /* 見出しは必ず1行。高さ予算(DENSITY のコメント参照)が崩れて文字が切れるのを防ぐ。 */
  .mini-h{font-weight:600; letter-spacing:.01em; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1}
  .mini-p{color:rgba(34,37,42,.6); overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical}
  .mini-rules{display:flex; flex-direction:column; flex:0 0 auto}
  .mini-rules i{display:block; height:1.5px; border-radius:1px; opacity:.55}
  /* スケルトン(白紙カード禁止 — ラベルは常に出る) */
  .mini.skel{background:#f6f5f3; border-style:dashed; border-color:var(--line); animation:skelPulse 1.9s ease-in-out infinite}
  .mini.skel .sk-band{height:13px; background:#eceae6}
  .mini.skel .sk-lines{padding:10px 9px; display:flex; flex-direction:column; gap:7px}
  .mini.skel .sk-lines i{display:block; height:5px; border-radius:3px; background:#eceae6}
  @keyframes skelPulse{0%,100%{opacity:1} 50%{opacity:.62}}
  .mini.failed{background:#f8f7f5; border-style:dashed; align-items:center; justify-content:center}
  .mini.failed span{font-size:10px; color:var(--muted); text-align:center; padding:0 8px; line-height:1.6}
  .mini.delegated{background:#f6f6f6; border-style:dashed; align-items:center; justify-content:center}
  .mini.delegated span{font-size:10.5px; color:var(--delegate); letter-spacing:.06em}

  /* ============ (e) コンパイルボタン ============ */
  #compileRow{margin-top:44px; display:flex; justify-content:center; position:relative; z-index:1}
  #btnCompile{
    background:var(--decided); color:#fff; border:0; border-radius:10px;
    padding:12px 34px; font-size:14px; letter-spacing:.1em;
    box-shadow:0 6px 18px rgba(42,74,127,.18);
    transition:opacity .25s ease, transform .25s ease;
  }
  #btnCompile:disabled{opacity:.55; cursor:default}
  #compileRow.in #btnCompile{animation:riseIn .5s ease both}
  @keyframes riseIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  /* ============ (f) コンパイル画面 ============ */
  #screenCompiled{max-width:920px; margin:0 auto; padding:64px 24px 96px}
  #asym{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 28px;
    padding-bottom:22px; border-bottom:1px solid var(--line);
  }
  #asym .item{font-size:12.5px; color:var(--muted); letter-spacing:.05em}
  #asym .item b{
    font-size:26px; font-weight:300; color:var(--ink); margin-left:10px;
    font-variant-numeric:tabular-nums;
  }
  #asym .item.choice b{color:var(--decided); font-weight:500}
  .outbar{display:flex; align-items:center; gap:8px; margin:22px 0 14px}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
  .seg button{
    background:transparent; border:0; padding:7px 16px; font-size:12.5px; color:var(--muted);
    transition:background-color .2s ease, color .2s ease;
  }
  .seg button[aria-selected="true"]{background:var(--ink); color:#fff}
  #btnCopy{
    margin-left:auto; background:transparent; border:1px solid var(--line);
    border-radius:9px; padding:7px 16px; font-size:12.5px; color:var(--ink-soft);
  }
  #out{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:22px 24px; font-size:12.5px; line-height:1.95;
    font-family:"SFMono-Regular",Menlo,Consolas,"Hiragino Sans",monospace;
    white-space:pre-wrap; word-break:break-word; overflow-x:auto;
    max-height:62vh; overflow-y:auto; color:var(--ink-soft);
  }
  #compileNote{font-size:11.5px; color:var(--muted); margin-top:14px; line-height:1.85}
  #btnRestart{
    display:block; margin:38px auto 0; background:transparent; border:0;
    font-size:11.5px; color:var(--muted); letter-spacing:.08em; text-decoration:underline;
    text-underline-offset:3px;
  }

  /* ============ (g) 並置証明 SplitCompare ============
     app/compare/*.html(事前生成物)を iframe で並べる。生成物は外部依存ゼロの
     自己完結HTMLなので sandbox="" で全能力を落として読み込む(スクリプト・フォーム不許可)。 */
  #btnCompare{
    display:block; margin:26px auto 0; background:transparent;
    border:1px solid var(--line); border-radius:9px; padding:9px 22px;
    font-size:12.5px; color:var(--ink-soft); letter-spacing:.05em;
  }
  #screenCompare{max-width:1180px; margin:0 auto; padding:56px 24px 96px}
  #screenCompare h2{
    font-size:15px; font-weight:500; letter-spacing:.08em; color:var(--ink);
    text-align:center; margin-bottom:8px;
  }
  #compareLead{
    font-size:12px; color:var(--muted); text-align:center; line-height:1.9;
    max-width:640px; margin:0 auto 30px;
  }
  #compareGrid{display:grid; grid-template-columns:1fr 1fr; gap:20px}
  @media (max-width:880px){ #compareGrid{grid-template-columns:1fr} }
  .cmp-col{display:flex; flex-direction:column; min-width:0}
  .cmp-head{display:flex; align-items:baseline; gap:10px; margin-bottom:9px}
  .cmp-head b{font-size:12.5px; font-weight:600; letter-spacing:.06em; color:var(--ink)}
  .cmp-head span{font-size:11px; color:var(--muted); line-height:1.7}
  .cmp-col.decided .cmp-head b{color:var(--decided)}
  .cmp-frame{
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    background:#fff; height:62vh; min-height:380px;
  }
  .cmp-frame iframe{display:block; width:100%; height:100%; border:0}
  #compareNote{font-size:11.5px; color:var(--muted); margin-top:20px; line-height:1.9; text-align:center}
  #btnCompareBack{
    display:block; margin:30px auto 0; background:transparent; border:0;
    font-size:11.5px; color:var(--muted); letter-spacing:.08em; text-decoration:underline;
    text-underline-offset:3px;
  }
</style>
</head>
<body>

<!-- ============ (a) 初期画面 ============ -->
<section id="screenInitial">
  <div id="promptBox">
    <textarea id="briefInput" rows="1" placeholder="何をお手伝いしましょうか?" autocomplete="off" spellcheck="false"></textarea>
    <div class="prompt-foot">
      <button id="btnSend" type="button" disabled aria-label="送信">↑</button>
    </div>
  </div>
  <div id="healthNote" hidden></div>
</section>

<!-- ============ (b)(c)(d)(e) ステージ ============ -->
<main id="screenStage" hidden>
  <div id="stage">
    <svg id="tethers" aria-hidden="true"></svg>
    <div id="briefText"></div>

    <div id="meta">
      <div id="silence">
        <div id="silenceNum">0.0<span class="u">s</span></div>
        <div id="silenceNote">x1.0 — 生成は、始まらない</div>
      </div>
      <div id="branchCounter" hidden></div>
    </div>

    <div id="assessNote" hidden></div>
    <div id="stageError" hidden></div>
    <div id="cards"></div>
    <div id="compileRow" hidden>
      <button id="btnCompile" type="button">コンパイル</button>
    </div>
  </div>
</main>

<!-- ============ (f) コンパイル画面 ============ -->
<section id="screenCompiled" hidden>
  <div id="asym">
    <div class="item">あなたがタイプした文字<b id="numTyped">0</b></div>
    <div class="item choice">あなたの選択<b id="numChoice">0</b></div>
  </div>
  <div class="outbar">
    <div class="seg" role="tablist">
      <button id="tabMd" type="button" role="tab" aria-selected="true">人間可読 MD</button>
      <button id="tabJson" type="button" role="tab" aria-selected="false">機械可読 JSON</button>
    </div>
    <button id="btnCopy" type="button">コピー</button>
  </div>
  <div id="out"></div>
  <div id="compileNote"></div>
  <button id="btnCompare" type="button">このブリーフで作らせた結果を見る</button>
  <button id="btnRestart" type="button">最初から</button>
</section>

<!-- ============ (g) 並置証明 SplitCompare ============
     左右とも app/compare/ の事前生成物(scripts/pregen_compare.py が実生成)。
     manifest.json に生成時刻・api_ms・使用プロンプト全文・選択の機械照合結果が残る。 -->
<section id="screenCompare" hidden>
  <h2>同じモデルに、同じ仕事をさせた</h2>
  <p id="compareLead">
    違うのは渡したものだけ。左は最初の一文をそのまま。右はコンパイル済みブリーフ。
    モデル・思考量・制作者プロンプトの骨格は同一。
  </p>
  <div id="compareGrid">
    <div class="cmp-col">
      <div class="cmp-head"><b>一文だけを渡した</b><span>入力: 発注者が書いた1文</span></div>
      <div class="cmp-frame"><iframe id="frameRaw" title="一文だけを渡した結果" sandbox="" loading="lazy"></iframe></div>
    </div>
    <div class="cmp-col decided">
      <div class="cmp-head"><b>コンパイル済みブリーフを渡した</b><span>入力: 同じ1文 + あなたの選択</span></div>
      <div class="cmp-frame"><iframe id="frameCompiled" title="コンパイル済みブリーフを渡した結果" sandbox="" loading="lazy"></iframe></div>
    </div>
  </div>
  <div id="compareNote"></div>
  <button id="btnCompareBack" type="button">ブリーフに戻る</button>
</section>

<script>
'use strict';

/* =========================================================================
   定数
   ========================================================================= */
const API = {
  health : '/api/health',
  explode: '/api/explode',
  explodeStream: '/api/explode_stream',
  render : '/api/render',
  compile: '/api/compile'
};
const MAX_CARDS = 5;
// 語スパンが後から増えても #cards が下へずれないよう、原文の高さを先に確保する量。
// 1スパンあたり margin .3em×2 + padding .1em×2 = 0.8em 広がる。
// 分岐5件 × anchor 数本を見込んで 20 スパン分を上限として押さえる。
const SPAN_RESERVE_EM = 20 * 0.8;

const FONTS = {
  serif  : '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif',
  sans   : '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif',
  rounded: '"Hiragino Maru Gothic ProN","Zen Maru Gothic","Quicksand","Hiragino Sans",sans-serif'
};
// density → ミニレンダの余白・行間・文字寸法・罫線間隔(決定論)
// density → ミニレンダの余白・行間・本文行数・罫線間隔(決定論)。
// 高さ予算は 84px = 帯13 + 本体71。本体 = 文字領域 + 罫線ブロック。
// 各値は「見出し1行 + 本文clamp行 + 罫線3本」が 71px に収まるよう決めてある(文字が切れない)。
//   airy  : 罫線22.5 / 文字48.5(内寸35.5) → 見出17 + 間5 + 本文1行12.8 = 34.8
//   normal: 罫線20.5 / 文字50.5(内寸39.5) → 見出14.5 + 間3 + 本文2行21.8 = 39.3
//   dense : 罫線14.5 / 文字56.5(内寸48.5) → 見出10.9 + 間2 + 本文4行32.2 = 45.1
// 本文行数が 1/2/4 と変わるので、120px でも density が判別できる。
const DENSITY = {
  airy  : {pad:'9px 9px 4px', gap:'5px', h:'10px',   p:'7.5px', lh:1.7,  clamp:1, rgap:'5px', rpad:'0 9px 8px'},
  normal: {pad:'7px 9px 4px', gap:'3px', h:'10px',   p:'7.5px', lh:1.45, clamp:2, rgap:'4px', rpad:'0 9px 8px'},
  dense : {pad:'5px 8px 3px', gap:'2px', h:'9.5px',  p:'7px',   lh:1.15, clamp:4, rgap:'2px', rpad:'0 8px 6px'}
};
const PAL_FALLBACK = ['#8d9196', '#c3c6c9', '#e4e5e6'];

/* =========================================================================
   状態(全状態はここに集約。画面上の表現は「原文の語の色」と「カウンタ」のみ)
   ========================================================================= */
const S = {
  brief: '',
  submitted: false,
  typedAfter: 0,                 // 最初の一文以降にタイプされた文字数(実測)
  branches: [],                  // /api/explode の branches(最大5)
  assessment: '',
  missing: [],
  spans: [],                     // {start,end,bis:[branchIndex...],text,el,hoverBi}
  decisions: [],                 // [{status:null|'decided'|'delegated', oi:number|null}]
  renders: [],                   // renders[bi][oi] = {state:'pending'|'ok'|'error', tokens?, error?}
  cardEls: [],
  silenceMs: 0,
  compileMs: 0,
  explodeTiming: null,
  compileTiming: null,
  frozen: false,                 // ポインタがカード近傍 → レイアウト凍結
  equalizePending: false,        // 凍結中に来た高さそろえ要求(解除後に適用する)
  exploded: false,               // 爆散アニメは1回のみ
  shattered: false,              // 語が割れる演出(#stage.exploded)を1回だけ started
  streaming: false,              // /api/explode_stream 受信中(done 未達)
  streamDone: false,             // done 到達 = 判断点の総数が確定した
  spanTaken: [],                 // 原文の各文字が既にスパンへ確保済みか(増分割当用)
  firstBranchMs: null,           // 送信→最初のカード表示(クライアント実測)
  allBranchesMs: null,           // 送信→全判断点の確定(done。クライアント実測)
  editingBi: null,
  rationales: {},
  compileError: ''
};

const $ = (id) => document.getElementById(id);
const elInitial = $('screenInitial'), elStage = $('screenStage'), elCompiled = $('screenCompiled');
const elInput = $('briefInput'), elSend = $('btnSend'), elPromptBox = $('promptBox');
const elBriefText = $('briefText'), elStageRoot = $('stage'), elSvg = $('tethers');
const elSilence = $('silence'), elSilenceNum = $('silenceNum');
const elCounter = $('branchCounter'), elCards = $('cards'), elCompileRow = $('compileRow');
const elCompile = $('btnCompile'), elAssess = $('assessNote'), elStageErr = $('stageError');

/* =========================================================================
   小さなユーティリティ
   ========================================================================= */
function hex2rgb(h){
  let s = String(h == null ? '' : h).trim();
  if (!/^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(s)) return null;
  s = s.replace('#','');
  if (s.length === 3) s = s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
  return [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
}
function normHex(h, fb){
  const rgb = hex2rgb(h);
  if (!rgb) return fb;
  return '#' + rgb.map(v => v.toString(16).padStart(2,'0')).join('');
}
function normPalette(p){
  const arr = Array.isArray(p) ? p : [];
  return [0,1,2].map(i => normHex(arr[i], PAL_FALLBACK[i]));
}
// 見出し文字の可読色: 淡すぎる色は中立の濃色へ倒す(決定論)
function readable(hex){
  const rgb = hex2rgb(hex) || [0,0,0];
  const l = (0.299*rgb[0] + 0.587*rgb[1] + 0.114*rgb[2]) / 255;
  return l > 0.62 ? '#3a3f46' : hex;
}
// palette[0] を白へ寄せた極淡の下地(決定論)
function tint(hex, ratio){
  const rgb = hex2rgb(hex) || [255,255,255];
  const r = ratio == null ? 0.94 : ratio;
  return 'rgb(' + rgb.map(v => Math.round(v + (255 - v) * r)).join(',') + ')';
}
// tone_sample(見出し+一文)を決定論的に2分割
function splitTone(s){
  const t = String(s == null ? '' : s).trim();
  if (!t) return ['', ''];
  let i = t.indexOf('\n');
  if (i > 0) return [t.slice(0, i).trim(), t.slice(i + 1).trim()];
  i = t.indexOf('。');
  if (i > 0 && i < t.length - 1) return [t.slice(0, i).trim(), t.slice(i + 1).trim()];
  i = t.search(/[　\s|｜/／]/);
  if (i > 0) return [t.slice(0, i).trim(), t.slice(i + 1).trim()];
  return [t, ''];
}
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
async function postJSON(url, body){
  const t0 = performance.now();
  let j = null, err = null;
  try{
    const res = await fetch(url, {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify(body)
    });
    j = await res.json();
  }catch(e){
    err = (e && e.message) ? e.message : String(e);
  }
  return {j: j, err: err, wall: performance.now() - t0};
}

/* =========================================================================
   (a) 初期画面 — 見慣れたプロンプト箱だけ
   ========================================================================= */
function autoGrow(){
  elInput.style.height = 'auto';
  elInput.style.height = Math.min(elInput.scrollHeight, 220) + 'px';
}
elInput.addEventListener('input', () => {
  autoGrow();
  elSend.disabled = elInput.value.trim().length === 0;
});
elInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    if (!elSend.disabled) submitBrief();
  }
});
elSend.addEventListener('click', () => { if (!elSend.disabled) submitBrief(); });

// 「最初の一文以降タイプしない」を実測する。送信後の入力文字を数える(通常は 0)。
document.addEventListener('beforeinput', (e) => {
  if (!S.submitted) return;
  const n = (e.data && e.data.length) ? e.data.length : (e.inputType && e.inputType.indexOf('insert') === 0 ? 1 : 0);
  S.typedAfter += n;
}, true);

// 起動時に静かにヘルスチェック(失敗時のみ表示)
(async function health(){
  try{
    const res = await fetch(API.health);
    const j = await res.json();
    if (!j || j.ok !== true) throw new Error('unhealthy');
  }catch(e){
    const n = $('healthNote');
    n.textContent = 'サーバに接続できません。gyakumon/ で python3 server.py を起動してください。';
    n.hidden = false;
  }
})();

/* =========================================================================
   (b) 静寂 — 生成は始まらない。実測時間をそのまま見せる。
   ========================================================================= */
// silenceT0 は「fetch を投げた瞬間」に置く(画面遷移アニメの 380ms を差し引かない)。
// 表示される秒数は送信から応答までの実測そのもの。
let silenceRAF = 0, silenceT0 = 0;
function startSilence(){
  const tick = () => {
    const ms = performance.now() - silenceT0;
    elSilenceNum.textContent = (ms / 1000).toFixed(1);
    elSilenceNum.appendChild(el('span', 'u', 's'));
    silenceRAF = requestAnimationFrame(tick);
  };
  tick();
}
function stopSilence(){
  cancelAnimationFrame(silenceRAF);
  S.silenceMs = performance.now() - silenceT0;
  elSilenceNum.textContent = (S.silenceMs / 1000).toFixed(1);
  elSilenceNum.appendChild(el('span', 'u', 's'));
}

async function submitBrief(){
  if (S.submitted) return;               // 二重送信の遮断(遷移中に1文字打つと送信ボタンが復活する)
  const brief = elInput.value.trim();
  if (!brief) return;
  S.brief = brief;
  S.submitted = true;
  elSend.disabled = true;
  elInput.blur();

  elPromptBox.classList.add('leaving');
  silenceT0 = performance.now();         // 静寂の起点 = 送信の瞬間
  setTimeout(() => {
    elInitial.hidden = true;
    elStage.hidden = false;
    elBriefText.textContent = S.brief;   // 静寂の間、原文はそのまま置かれている
    startSilence();
  }, 380);

  // まず SSE(/api/explode_stream)。確定した分岐から順にカードを出す。
  // ストリームが「1枚も出せないまま」失敗したときだけ、旧 /api/explode へ自動で戻す。
  let streamed = false;
  try{
    streamed = await explodeViaStream(brief);
  }catch(e){
    streamed = false;
  }
  if (streamed || S.exploded) return;

  // ---- フォールバック: 従来どおり一括で受け取ってから爆散する ----
  const r = await postJSON(API.explode, {brief: brief});
  const wall = performance.now() - silenceT0;

  // 遷移アニメ中に応答が返っても、ステージ表示後に処理する
  const proceed = () => {
    if (S.exploded) return;                      // 後着応答による S.branches の後勝ち上書きを禁じる
    if (elStage.hidden){ setTimeout(proceed, 60); return; }
    stopSilence();
    if (r.err){ showStageError('抽出に失敗しました(' + r.err + ')', 'server.py が起動しているか確認してください。'); return; }
    if (!r.j || r.j.ok !== true){
      const msg = (r.j && r.j.error) ? String(r.j.error) : '不明なエラー';
      const hint = (r.j && r.j.hint) ? String(r.j.hint) : '';
      showStageError('抽出に失敗しました: ' + msg, hint);
      return;
    }
    S.explodeTiming = r.j.timing || {wall_ms: Math.round(wall)};
    S.branches = (Array.isArray(r.j.branches) ? r.j.branches : []).slice(0, MAX_CARDS);
    S.assessment = String(r.j.residual_ambiguity_assessment || '');
    S.missing = Array.isArray(r.j.missing_materials) ? r.j.missing_materials.map(String) : [];
    explode();
  };
  proceed();
}

/* =========================================================================
   (b') ストリーミング爆散 — 確定した分岐から順に届く
   -------------------------------------------------------------------------
   サーバは分岐1件ぶんのJSONが閉じるたびに anchor 検証を通してから送ってくる。
   到着ごとにカードを1枚足す。既に置いたカードは動かさない(条項4):
     - 原文の高さは最初に上限まで確保する(reserveBriefHeight)ので、
       語スパンが増えて原文が広がっても #cards は下へずれない。
     - #cards.streaming の間は「最後の1枚を中央寄せ」規則を止める。
     - カード高さは到着のたびに最大値へ揃え直す(まだ操作前なので force してよい)。
   戻り値: true = ストリームで画面を作った(フォールバック不要)
           false = 1枚も出せずに失敗した(呼び出し側が /api/explode へ戻す)
   ========================================================================= */
async function explodeViaStream(brief){
  // フォールバックへ戻るときは S.streaming を必ず畳んでおく。
  // 残したままだとカウンタが「抽出中…」で固まる。
  const bail = () => { S.streaming = false; return false; };
  let res;
  try{
    res = await fetch(API.explodeStream, {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({brief: brief})
    });
  }catch(e){ return bail(); }
  if (!res.ok || !res.body || !res.body.getReader) return bail();
  // 総数未確定の印はストリームが開いた時点で立てる。
  // 以前は meta イベントで立てていたが、スキーマが branches 先になった以上
  // 「meta より先に branch が届く」順序があり得るので、meta には依存させない。
  // (これがないと最初のカードで updateCounter が確定値「N→0」を出してしまう)
  S.streaming = true;

  const reader = res.body.getReader();
  const dec = new TextDecoder('utf-8');
  let buf = '';
  let sawDone = false;
  let hardError = null;

  const handle = (obj) => {
    if (!obj || typeof obj !== 'object') return;
    if (obj.type === 'meta'){
      // 画面は変えず、届いた分だけ内部に保持する。
      // branches 先スキーマでは meta は空(partial=true)の先触れとして先に来て、
      // 本文は done で確定する。後着でも空でも取りこぼさないよう、
      // 「中身があるときだけ上書きする」規則にしてある。
      if (typeof obj.residual_ambiguity_assessment === 'string' && obj.residual_ambiguity_assessment){
        S.assessment = obj.residual_ambiguity_assessment;
      }
      if (Array.isArray(obj.missing_materials) && obj.missing_materials.length){
        S.missing = obj.missing_materials.map(String);
      }
      return;
    }
    if (obj.type === 'branch' && obj.branch){
      appendBranch(obj.branch);
      return;
    }
    if (obj.type === 'done'){
      sawDone = true;
      finishStream(obj);
      return;
    }
    if (obj.type === 'error'){
      hardError = obj;
      return;
    }
  };

  try{
    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let sep;
      while ((sep = buf.indexOf('\n\n')) >= 0){
        const rec = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        const line = rec.trim();
        if (!line || line.charAt(0) === ':') continue;   // ハートビート(SSEコメント)
        if (line.indexOf('data: ') !== 0) continue;
        let obj = null;
        try{ obj = JSON.parse(line.slice(6)); }catch(e){ continue; }
        handle(obj);
      }
    }
  }catch(e){
    // 途中切断。既にカードが出ているなら、届いた分で締める。
    if (S.exploded && !sawDone){ finishStream(null); return true; }
    return bail();
  }

  if (hardError && !S.exploded){
    // 1枚も出せていない → 呼び出し側が /api/explode へ戻す。ここでは画面を触らない。
    return bail();
  }
  if (!sawDone){
    if (S.exploded){ finishStream(null); return true; }   // 届いた分で締める
    return bail();                                        // 何も起きずに閉じた → フォールバック
  }
  return true;
}

// 爆散の開始。最初の分岐 or done(分岐0件)のどちらか早い方で1回だけ走る。
function beginExplode(){
  if (S.exploded) return;
  S.exploded = true;
  if (elStage.hidden){                                   // 遷移アニメ(380ms)より先に届いた場合
    elInitial.hidden = true;
    elStage.hidden = false;
    elBriefText.textContent = S.brief;
  }
  stopSilence();                                         // 静寂の実測値 = 最初のカードが出るまで
  reserveBriefHeight();
  renderBriefWithSpans();                                // この時点ではスパン0本(原文そのまま)
  elSilence.classList.add('done');
}

// 語スパンが後から増えても原文の行数が増えないよう、先に高さを確保する。
// 上限ぶんの幅を持つ不可視スペーサを一度だけ流し込んで測る。
function reserveBriefHeight(){
  const sp = el('span');
  sp.style.display = 'inline-block';
  sp.style.width = SPAN_RESERVE_EM + 'em';
  sp.style.height = '0';
  elBriefText.appendChild(sp);
  const h = elBriefText.offsetHeight;
  elBriefText.removeChild(sp);
  if (h > 0) elBriefText.style.minHeight = h + 'px';
}

// 分岐1件を画面へ足す(状態 → スパン → カード → テザー → レンダ発注)
function appendBranch(b){
  if (!b || S.branches.length >= MAX_CARDS) return;
  beginExplode();

  const bi = S.branches.length;
  S.branches.push(b);
  S.decisions.push({status: null, oi: null});
  S.renders.push((Array.isArray(b.options) ? b.options : []).map(() => ({state: 'pending'})));

  claimSpansFor(bi);
  renderBriefWithSpans();

  const card = buildCard(bi);
  card.style.transitionDelay = '0ms';                    // 到着そのものが間隔になる
  card.classList.add('pending');
  elCards.appendChild(card);
  S.cardEls.push(card);

  equalizeCardHeights();                                 // 未凍結なら毎回そろえ直す(凍結中は保留)
  updateCounter();
  elCounter.hidden = false;
  startRendersFor(bi);                                   // ミニレンダは到着直後から並列で発注する

  if (!S.shattered){
    S.shattered = true;
    S.firstBranchMs = performance.now() - silenceT0;
    elCards.classList.add('streaming');
    requestAnimationFrame(() => {
      elStageRoot.classList.add('exploded');             // 語が割れる(1回のみ)
      animateTethers(900);
      setTimeout(() => {                                 // 割れてからカードが現れる
        elCards.classList.add('in');
        card.classList.remove('pending');
        drawTethers();
      }, 140);
    });
    return;
  }
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { card.classList.remove('pending'); drawTethers(); });
  });
  drawTethers();
}

// done(または途中終了)で締める。ここで初めて判断点の総数が確定する。
function finishStream(obj){
  if (S.streamDone) return;
  S.streamDone = true;
  S.streaming = false;
  S.allBranchesMs = performance.now() - silenceT0;
  beginExplode();                                        // 分岐0件のときはここが初回

  if (obj){
    if (typeof obj.residual_ambiguity_assessment === 'string'){
      S.assessment = obj.residual_ambiguity_assessment;
    }
    if (Array.isArray(obj.missing_materials)) S.missing = obj.missing_materials.map(String);
    S.explodeTiming = obj.timing || null;
    if (S.explodeTiming){
      S.explodeTiming.first_branch_ms = (obj.first_branch_ms != null)
        ? obj.first_branch_ms : (S.firstBranchMs != null ? Math.round(S.firstBranchMs) : null);
      S.explodeTiming.streamed = true;
    }
  }

  if (S.branches.length === 0){
    // 分岐0件は正当な出力(完全指定ブリーフ)。捏造せず、そのまま伝える。
    elAssess.hidden = false;
    elAssess.textContent = S.assessment || 'このブリーフは十分に特定されている。抽出すべき判断点はない。';
    updateCounter();
    elCounter.hidden = false;
    elCompileRow.hidden = false;
    elCompileRow.classList.add('in');
    return;
  }

  // ストリーミング用の抑制を解除する。最後の1枚(まだフェードイン直後)だけが
  // 中央寄せ規則の対象になるので、既に置いたカードは動かない。
  elCards.classList.remove('streaming');
  equalizeCardHeights();
  updateCounter();
  drawTethers();
}

function showStageError(msg, hint){
  elSilence.classList.add('done');
  elStageErr.hidden = false;
  elStageErr.textContent = '';
  elStageErr.appendChild(document.createTextNode(msg));
  if (hint) elStageErr.appendChild(el('span', 'hint', hint));
  const back = el('button', null, '書き直す');
  back.type = 'button';
  back.addEventListener('click', () => location.reload());
  elStageErr.appendChild(document.createElement('br'));
  elStageErr.appendChild(back);
}

/* =========================================================================
   (c) 爆散 — 語スパン分解 + カード配置 + SVGテザー
   ========================================================================= */
// anchor_words を原文にマッチさせて span 化する。
//
// 「スパン0本の分岐」を絶対に作らないことがこの関数の責務である。スパンが0本になると
//   条項2c(anchor 語とテザーで結ばれる)・条項5(全状態は原文の語の色とカウンタのみ)・
//   条項6(確定/委任済みの語をクリックして再選択)が同時に破れる。
// サーバの anchor 検証は「原文の連続部分文字列か」しか見ないので、分岐間の入れ子
//   (分岐A「高級感のある」/ 分岐B「高級感」が原文に1出現しかない)は防げない。
//
// 3パス構成:
//   A. 分岐公平 — 各分岐に1本ずつ、その分岐内の長い anchor から順に空き出現を確保する。
//   B. 残りの候補を長い順に確保する(従来の最長一致優先)。
//   C. 保険 — それでも0本の分岐を、その anchor と重なる既存スパンへ相乗りさせる。
//      1つのスパンは複数分岐を持ちうる(span.bis)。
function buildSpans(text, branches){
  const taken = new Array(text.length).fill(false);
  const spans = [];
  const anchorsOf = (b) => (Array.isArray(b.anchor_words) ? b.anchor_words : [])
    .filter(a => typeof a === 'string' && a.length > 0)
    .slice()
    .sort((x, y) => y.length - x.length);

  // 指定 anchor の「空き出現」を1つ確保する(取れたら true)
  function claim(bi, a){
    let from = 0;
    while (true){
      const i = text.indexOf(a, from);
      if (i < 0) return false;
      const j = i + a.length;
      let free = true;
      for (let k = i; k < j; k++){ if (taken[k]){ free = false; break; } }
      if (free){
        for (let k = i; k < j; k++) taken[k] = true;
        spans.push({start: i, end: j, bis: [bi], text: a, el: null, hoverBi: null});
        return true;
      }
      from = i + 1;
    }
  }

  // パスA: 分岐ごとに1本ずつ(公平)
  const pending = branches.map(b => anchorsOf(b));
  pending.forEach((list, bi) => {
    for (let k = 0; k < list.length; k++){
      if (claim(bi, list[k])){ list.splice(k, 1); break; }
    }
  });

  // パスB: 残りを長い順に
  const rest = [];
  pending.forEach((list, bi) => list.forEach(a => rest.push({a: a, bi: bi})));
  rest.sort((x, y) => (y.a.length - x.a.length) || (x.bi - y.bi));
  rest.forEach(c => claim(c.bi, c.a));

  // パスC: スパン0本の分岐を既存スパンへ相乗りさせる(入れ子・同一 anchor の救済)
  branches.forEach((b, bi) => {
    if (spans.some(sp => sp.bis.indexOf(bi) >= 0)) return;
    const list = anchorsOf(b);
    for (const a of list){
      let from = 0, hit = null;
      while (true){
        const i = text.indexOf(a, from);
        if (i < 0) break;
        const j = i + a.length;
        let best = null, bestOv = 0;
        spans.forEach(sp => {
          const ov = Math.min(sp.end, j) - Math.max(sp.start, i);
          if (ov > bestOv && sp.bis.indexOf(bi) < 0){ bestOv = ov; best = sp; }
        });
        if (best){ hit = best; break; }
        from = i + 1;
      }
      if (hit){ hit.bis.push(bi); break; }
    }
  });

  spans.sort((x, y) => x.start - y.start);
  return spans;
}

// ストリーミング用: 分岐が1件届くたびに、その分岐ぶんのスパンだけを確保する。
// buildSpans と同じ3つの原則を「到着順」に適用する:
//   A/B. その分岐の anchor を長い順に、まだ誰も取っていない出現へ割り当てる
//   C.   1本も取れなかったら、重なる既存スパンへ相乗りさせる(スパン0本の分岐を作らない)
// パスAの「分岐間の公平割当」だけは到着順のため成立しないが、
// 0本の分岐が生じないことはパスCが保証する(条項2c/5/6 の前提はここで守られる)。
function claimSpansFor(bi){
  const text = S.brief;
  const b = S.branches[bi];
  if (S.spanTaken.length !== text.length){
    S.spanTaken = new Array(text.length).fill(false);
    S.spans.forEach(sp => { for (let k = sp.start; k < sp.end; k++) S.spanTaken[k] = true; });
  }
  const anchors = (Array.isArray(b.anchor_words) ? b.anchor_words : [])
    .filter(a => typeof a === 'string' && a.length > 0)
    .slice()
    .sort((x, y) => y.length - x.length);

  let got = false;
  anchors.forEach(a => {
    let from = 0;
    while (true){
      const i = text.indexOf(a, from);
      if (i < 0) return;
      const j = i + a.length;
      let free = true;
      for (let k = i; k < j; k++){ if (S.spanTaken[k]){ free = false; break; } }
      if (free){
        for (let k = i; k < j; k++) S.spanTaken[k] = true;
        S.spans.push({start: i, end: j, bis: [bi], text: a, el: null, hoverBi: null});
        got = true;
        return;
      }
      from = i + 1;
    }
  });

  if (!got){
    // 保険: 入れ子・同一 anchor で1本も取れなかった分岐を既存スパンへ相乗りさせる
    for (const a of anchors){
      let from = 0, hit = null;
      while (true){
        const i = text.indexOf(a, from);
        if (i < 0) break;
        const j = i + a.length;
        let best = null, bestOv = 0;
        S.spans.forEach(sp => {
          const ov = Math.min(sp.end, j) - Math.max(sp.start, i);
          if (ov > bestOv && sp.bis.indexOf(bi) < 0){ bestOv = ov; best = sp; }
        });
        if (best){ hit = best; break; }
        from = i + 1;
      }
      if (hit){ hit.bis.push(bi); break; }
    }
  }
  S.spans.sort((x, y) => x.start - y.start);
}

// スパンが持つ分岐のうち「クリックで開く分岐」= 未解決を優先、なければ先頭
function activeBi(sp){
  for (const bi of sp.bis){
    const d = S.decisions[bi];
    if (!d || !d.status) return bi;
  }
  return sp.bis[0];
}
// 語の色: 未解決の分岐が1つでも載っていれば open。全解決なら決定を優先して表示する。
function spanState(sp){
  let hasDecided = false;
  for (const bi of sp.bis){
    const d = S.decisions[bi];
    if (!d || !d.status) return 'open';
    if (d.status === 'decided') hasDecided = true;
  }
  return hasDecided ? 'decided' : 'delegated';
}
function hasSpan(bi){
  return S.spans.some(sp => sp.bis.indexOf(bi) >= 0);
}

// ストリーミングではスパンが増えるたびに呼ばれる(原文を組み直す)。
// #stage.exploded が既に付いている状態で作られた .tok は開始値を持たないので
// 遷移せず最終位置に現れる = 既存の語が割れ直すようには見えない。
// 語の色は spanState から引くので、決定済みの語は組み直しても色を保つ。
function renderBriefWithSpans(){
  const text = S.brief;
  elBriefText.textContent = '';
  let cur = 0, n = 0;
  for (const sp of S.spans){
    if (sp.start > cur) elBriefText.appendChild(document.createTextNode(text.slice(cur, sp.start)));
    const t = el('span', 'tok', sp.text);
    t.dataset.bi = sp.bis.join(',');
    t.dataset.state = S.decisions.length ? spanState(sp) : 'open';
    t.style.transitionDelay = (n * 26) + 'ms';
    t.addEventListener('click', () => onTokenClick(activeBi(sp)));
    t.addEventListener('pointerenter', () => { sp.hoverBi = activeBi(sp); highlight(sp.hoverBi, true); });
    t.addEventListener('pointerleave', () => {
      if (sp.hoverBi != null) highlight(sp.hoverBi, false);
      sp.hoverBi = null;
    });
    elBriefText.appendChild(t);
    sp.el = t;
    cur = sp.end;
    n++;
  }
  if (cur < text.length) elBriefText.appendChild(document.createTextNode(text.slice(cur)));
}

function explode(){
  if (S.exploded) return;
  S.exploded = true;
  S.shattered = true;
  S.streaming = false;          // 一括経路では最初から総数が確定している
  S.streamDone = true;

  S.decisions = S.branches.map(() => ({status: null, oi: null}));
  S.renders   = S.branches.map(b => (Array.isArray(b.options) ? b.options : []).map(() => ({state: 'pending'})));
  S.spans = buildSpans(S.brief, S.branches);

  renderBriefWithSpans();
  elSilence.classList.add('done');

  if (S.branches.length === 0){
    // 分岐0件は正当な出力(完全指定ブリーフ)。捏造せず、そのまま伝える。
    elAssess.hidden = false;
    elAssess.textContent = S.assessment || 'このブリーフは十分に特定されている。抽出すべき判断点はない。';
    updateCounter();
    elCounter.hidden = false;
    elCompileRow.hidden = false;
    elCompileRow.classList.add('in');
    return;
  }

  requestAnimationFrame(() => {
    elStageRoot.classList.add('exploded');      // 語が割れる(1回のみ)
    setTimeout(() => {
      buildCards();
      equalizeCardHeights();                    // rAF を待たず同期で高さを固定(凍結レース回避)
      updateCounter();
      elCounter.hidden = false;
      requestAnimationFrame(() => {
        elCards.classList.add('in');            // カードがフェードイン
        animateTethers(900);
      });
      startRenders();
    }, 140);
  });
}

/* ---- カード ---- */
// 1枚ぶんを組み立てて返す(DOMへの挿入は呼び出し側)。
// 一括版 buildCards とストリーミング版 appendBranch が同じ実装を使う。
function buildCard(bi){
  const b = S.branches[bi];
  const card = el('article', 'card');
  card.dataset.bi = String(bi);
  card.setAttribute('aria-label', '判断点 ' + (bi + 1));
  card.style.transitionDelay = (bi * 70) + 'ms';

  card.appendChild(el('div', 'q', String(b.question_point || '(判断点)')));
  if (b.downstream_impact) card.appendChild(el('div', 'impact', String(b.downstream_impact)));

  const opts = el('div', 'opts');
  const options = Array.isArray(b.options) ? b.options : [];
  options.forEach((o, oi) => {
    const btn = el('button', 'opt');
    btn.type = 'button';
    btn.dataset.oi = String(oi);
    btn.setAttribute('aria-pressed', 'false');
    if (o && o.thumbnail_description) btn.title = String(o.thumbnail_description);
    const slot = el('div', 'slot');
    slot.appendChild(skeletonMini());
    btn.appendChild(slot);
    btn.appendChild(el('div', 'olabel', String((o && o.label) || 'オプション ' + (oi + 1))));
    btn.addEventListener('click', () => decide(bi, oi));   // 動詞1: 決める
    opts.appendChild(btn);
  });
  card.appendChild(opts);

  const foot = el('div', 'card-foot');
  const dele = el('button', 'delegate', '委ねる');          // 動詞2: 委ねる
  dele.type = 'button';
  dele.addEventListener('click', () => delegate(bi));
  foot.appendChild(dele);
  card.appendChild(foot);

  const resolved = el('div', 'resolved');
  resolved.hidden = true;
  card.appendChild(resolved);

  card.addEventListener('pointerenter', () => { card.classList.add('near'); highlight(bi, true); });
  card.addEventListener('pointerleave', () => { card.classList.remove('near'); highlight(bi, false); });
  return card;
}

function buildCards(){
  elCards.textContent = '';
  S.cardEls = [];
  S.branches.forEach((b, bi) => {
    const card = buildCard(bi);
    elCards.appendChild(card);
    S.cardEls.push(card);
  });
}

// 高さを最大値に揃えて固定する。以後どの状態遷移でもカードは動かない(リフローなし)。
//
// 凍結(S.frozen)中は例外なく触らない。
// 以前は引数 force=true が凍結を貫通できた。しかしこの関数は「全カードの min-height を
// いったん外して測り直す」ため、貫通すると凍結中に既存カードの高さが変わりうる
// (= 条項4「凍結中に既存カードを動かさない」の穴)。ストリーミング中は新しいカードが
// 届くたび force で呼ばれていたので、これは机上の穴ではなく実際に起きる経路だった。
// 凍結中の要求は S.equalizePending に積み、凍結が解けた後の呼び出しで適用する。
// force 引数は貫通しない以上ただの飾りなので削除した。
//
// force が担っていた「凍結より前に必ず1回ロックする」役目は、凍結する側(pointermove)が
// S.frozen を立てる直前に自分で1回そろえることで引き継いだ。
function equalizeCardHeights(){
  if (S.cardEls.length === 0) return;
  if (S.frozen){ S.equalizePending = true; return; }   // 解除後の呼び出しで適用する
  S.equalizePending = false;
  S.cardEls.forEach(c => { c.style.minHeight = ''; });
  let max = 0;
  S.cardEls.forEach(c => { max = Math.max(max, c.offsetHeight); });
  S.cardEls.forEach(c => { c.style.minHeight = max + 'px'; });
}

// ポインタがカード近傍(80px)に入ったらレイアウト凍結
document.addEventListener('pointermove', (e) => {
  if (S.frozen || S.cardEls.length === 0) return;
  const r = elCards.getBoundingClientRect();
  const pad = 80;
  if (e.clientX >= r.left - pad && e.clientX <= r.right + pad &&
      e.clientY >= r.top - pad && e.clientY <= r.bottom + pad){
    equalizeCardHeights();       // まだ凍結前。ここで高さを確定させてから凍らせる
    S.frozen = true;
  }
}, {passive: true});

/* ---- ミニレンダ(tokens → 決定論描画。LLMは tokens しか返さない) ---- */
function skeletonMini(){
  const box = el('div', 'mini skel');
  box.appendChild(el('div', 'sk-band'));
  const lines = el('div', 'sk-lines');
  ['62%', '88%', '74%'].forEach(w => { const i = el('i'); i.style.width = w; lines.appendChild(i); });
  box.appendChild(lines);
  return box;
}
function failedMini(){
  const box = el('div', 'mini failed');
  box.appendChild(el('span', null, 'レンダ未着'));
  return box;
}
function delegatedMini(){
  const box = el('div', 'mini delegated');
  box.appendChild(el('span', null, '制作者の裁量'));
  return box;
}
function tokensMini(tokens){
  const t = tokens || {};
  const pal = normPalette(t.palette);
  const d = DENSITY[t.density] || DENSITY.normal;
  const font = FONTS[t.heading_font] || FONTS.sans;

  const box = el('div', 'mini');
  box.style.borderRadius = (t.corner === 'sharp') ? '2px' : '10px';
  box.style.background = tint(pal[0]);
  box.style.borderColor = 'rgba(34,37,42,.12)';

  const band = el('div', 'mini-band');
  [[pal[0], '52%'], [pal[1], '28%'], [pal[2], '20%']].forEach(pair => {
    const s = el('div');
    s.style.background = pair[0];
    s.style.width = pair[1];
    band.appendChild(s);
  });
  box.appendChild(band);

  const body = el('div', 'mini-body');
  const wrap = el('div', 'mini-textwrap');
  wrap.style.padding = d.pad;
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.gap = d.gap;

  const parts = splitTone(t.tone_sample);
  const h = el('div', 'mini-h', parts[0]);
  h.style.fontFamily = font;
  h.style.fontSize = d.h;
  h.style.lineHeight = String(d.lh);
  h.style.color = readable(pal[0]);
  wrap.appendChild(h);

  if (parts[1]){
    const p = el('div', 'mini-p', parts[1]);
    p.style.fontFamily = font;
    p.style.fontSize = d.p;
    p.style.lineHeight = String(d.lh);
    p.style.webkitLineClamp = String(d.clamp);
    wrap.appendChild(p);
  }
  body.appendChild(wrap);

  // 罫線の間隔で density を 120px でも判別可能にする
  const rules = el('div', 'mini-rules');
  rules.style.gap = d.rgap;
  rules.style.padding = d.rpad;
  ['100%', '84%', '58%'].forEach(w => {
    const i = el('i');
    i.style.width = w;
    i.style.background = pal[2];
    rules.appendChild(i);
  });
  body.appendChild(rules);

  box.appendChild(body);
  return box;
}

// /api/render は並列 fetch。到着順にスロットへ着地(スロットは固定寸法なのでリフローなし)。
// 対照性は sibling_labels(同じ判断点に並ぶ他オプションのラベル)を渡して担保する。
// レンダラーが「離れるべき方向」を直接知るので、3枚が中庸な値へ収束しない。
function startRendersFor(bi){
  const b = S.branches[bi];
  if (!b) return;
  const options = Array.isArray(b.options) ? b.options : [];
  const labels = options.map(o => String((o && o.label) || ''));
  options.forEach(async (o, oi) => {
    const r = await postJSON(API.render, {
      brief: S.brief,
      question_point: String(b.question_point || ''),
      option: { label: labels[oi] },
      sibling_labels: labels.filter((_, k) => k !== oi && labels[k] !== '')
    });
    if (r.err || !r.j || r.j.ok !== true){
      S.renders[bi][oi] = {state: 'error', error: r.err || (r.j && r.j.error) || 'render failed'};
    }else{
      S.renders[bi][oi] = {state: 'ok', tokens: r.j.tokens || {}};
    }
    placeMini(bi, oi);
  });
}
function startRenders(){
  S.branches.forEach((b, bi) => startRendersFor(bi));
}
function placeMini(bi, oi){
  const card = S.cardEls[bi];
  if (!card) return;
  const btn = card.querySelector('.opt[data-oi="' + oi + '"]');
  if (!btn) return;
  const slot = btn.querySelector('.slot');
  if (!slot) return;
  const st = S.renders[bi][oi];
  slot.textContent = '';
  slot.appendChild(st.state === 'ok' ? tokensMini(st.tokens) : failedMini());
  // 決定済みカードの表示にも反映(既に決めた選択肢のレンダが後から届いた場合)
  const d = S.decisions[bi];
  if (d && d.status === 'decided' && d.oi === oi && !card.classList.contains('editing')) paintResolved(bi);
}

/* =========================================================================
   (d) 2つの動詞 — 決める / 委ねる
   ========================================================================= */
// 別カードを再提示中(opts 展開中)のまま放置すると、opts が開いたカードが2枚並ぶ。
// 「全状態は原文の語の色とカウンタのみ」の規律を守るため、先に畳んでから確定する。
function closeEditingExcept(bi){
  if (S.editingBi != null && S.editingBi !== bi) paintResolved(S.editingBi);
  S.editingBi = null;
}
function decide(bi, oi){
  closeEditingExcept(bi);
  S.decisions[bi] = {status: 'decided', oi: oi};
  paintResolved(bi);
  paintTokens(bi);
  updateCounter();
  drawTethers();
}
function delegate(bi){
  closeEditingExcept(bi);
  S.decisions[bi] = {status: 'delegated', oi: null};
  paintResolved(bi);
  paintTokens(bi);
  updateCounter();
  drawTethers();
}

function paintResolved(bi){
  const card = S.cardEls[bi];
  if (!card) return;
  const d = S.decisions[bi];
  const b = S.branches[bi];
  const opts = card.querySelector('.opts');
  const foot = card.querySelector('.card-foot');
  const res = card.querySelector('.resolved');

  card.classList.remove('editing');
  card.dataset.state = d.status;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.setAttribute('aria-pressed', String(d.status === 'decided' && Number(btn.dataset.oi) === d.oi));
  });
  opts.hidden = true;
  foot.hidden = true;
  res.hidden = false;
  res.textContent = '';

  // 条項6(再選択)の保証。原文にスパンを持たない分岐が万一生じても再提示経路が残るよう、
  // 決定表示そのものをクリック可能にし、案内文も実際に効く操作へ出し分ける。
  const viaSpan = hasSpan(bi);
  const hint = viaSpan ? '原文の語をクリックすると選び直せます' : 'この決定をクリックすると選び直せます';
  if (!res.dataset.reopen){
    res.dataset.reopen = '1';
    res.addEventListener('click', () => onTokenClick(bi));
  }

  if (d.status === 'decided'){
    const st = (S.renders[bi] || [])[d.oi];
    res.appendChild(st && st.state === 'ok' ? tokensMini(st.tokens) : (st && st.state === 'error' ? failedMini() : skeletonMini()));
    const o = (Array.isArray(b.options) ? b.options : [])[d.oi] || {};
    const tx = el('div', 'rtext');
    tx.appendChild(el('span', 'rkind', '決めた'));
    tx.appendChild(el('strong', null, String(o.label || '')));
    tx.appendChild(el('span', 'rhint', hint));
    res.appendChild(tx);
  }else{
    res.appendChild(delegatedMini());
    const tx = el('div', 'rtext');
    tx.appendChild(el('span', 'rkind', '委ねた'));
    tx.appendChild(el('strong', null, String(b.default_if_unresolved || '制作者の裁量に委ねる')));
    tx.appendChild(el('span', 'rhint', hint));
    res.appendChild(tx);
  }
}

function paintTokens(bi){
  S.spans.forEach(sp => {
    if (sp.bis.indexOf(bi) < 0 || !sp.el) return;
    sp.el.dataset.state = spanState(sp);
  });
}

// 確定/委任済みの語をクリック → そのカードを再提示して再選択可(状態上書き・多段アンドゥなし)
function onTokenClick(bi){
  const card = S.cardEls[bi];
  if (!card) return;
  const d = S.decisions[bi];
  if (!d || !d.status){
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 700);
    card.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    return;
  }
  if (S.editingBi === bi){ paintResolved(bi); S.editingBi = null; drawTethers(); return; }
  if (S.editingBi != null) paintResolved(S.editingBi);
  S.editingBi = bi;

  const opts = card.querySelector('.opts');
  const foot = card.querySelector('.card-foot');
  const res  = card.querySelector('.resolved');
  res.hidden = true;
  opts.hidden = false;
  foot.hidden = false;
  card.classList.add('editing');
  card.querySelectorAll('.opt').forEach(btn => {
    btn.setAttribute('aria-pressed', String(d.status === 'decided' && Number(btn.dataset.oi) === d.oi));
  });
  card.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  drawTethers();
}

function highlight(bi, on){
  S.spans.forEach(sp => {
    if (sp.bis.indexOf(bi) >= 0 && sp.el) sp.el.classList.toggle('hl', !!on);
  });
  const card = S.cardEls[bi];
  if (card) card.classList.toggle('near', !!on);
  drawTethers(bi, on);
}

function remaining(){
  return S.decisions.filter(d => !d.status).length;
}
function updateCounter(){
  const n = remaining();
  elCounter.textContent = '';
  // 総数が確定する前(ストリーミング中)は「N→0」を出さない。
  // まだ増えるかもしれない数を確定値のように見せないための規律。
  if (S.streaming && !S.streamDone){
    elCounter.appendChild(document.createTextNode('判断点を抽出中… '));
    elCounter.appendChild(el('b', null, String(S.branches.length)));
    elCounter.classList.remove('zero');
    return;
  }
  elCounter.appendChild(document.createTextNode('この文から抽出した判断点 '));
  elCounter.appendChild(el('b', null, String(n)));
  elCounter.appendChild(document.createTextNode('→0'));
  elCounter.classList.toggle('zero', n === 0);
  // 総数未確定のうちは、たまたま残り0でもコンパイルへ進ませない
  if (n === 0 && S.branches.length > 0 && elCompileRow.hidden && !S.streaming){
    elCompileRow.hidden = false;
    elCompileRow.classList.add('in');
  }
}

/* =========================================================================
   SVGテザー(語スパン中心 → カード上辺)
   ========================================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';
function drawTethers(hlBi, hlOn){
  if (!S.exploded || S.branches.length === 0) return;
  const sb = elStageRoot.getBoundingClientRect();
  elSvg.setAttribute('width', String(Math.round(sb.width)));
  elSvg.setAttribute('height', String(Math.round(sb.height)));
  elSvg.setAttribute('viewBox', '0 0 ' + Math.round(sb.width) + ' ' + Math.round(sb.height));
  while (elSvg.firstChild) elSvg.removeChild(elSvg.firstChild);

  // 1つのスパンが複数分岐を持つ(入れ子 anchor の相乗り)場合は、その全分岐へ結線する。
  // これがないと相乗り側のカードが原文と結ばれず、条項2c が破れる。
  S.spans.forEach(sp => {
    if (!sp.el) return;
    const tb = sp.el.getBoundingClientRect();
    const x1 = tb.left + tb.width / 2 - sb.left;
    const y1 = tb.bottom - sb.top + 2;
    let drewDot = false;

    sp.bis.forEach(bi => {
      const card = S.cardEls[bi];
      if (!card) return;
      const cb = card.getBoundingClientRect();
      const y2 = cb.top - sb.top;
      if (y2 <= y1) return;
      const x2 = Math.min(Math.max(x1, cb.left - sb.left + 18), cb.right - sb.left - 18);
      const dy = (y2 - y1) * 0.45;

      const st = S.decisions[bi] ? S.decisions[bi].status : null;
      const hot = (hlOn && hlBi === bi);
      let stroke = 'rgba(34,37,42,.20)', dash = '';
      if (st === 'decided'){ stroke = 'rgba(42,74,127,.55)'; }
      else if (st === 'delegated'){ stroke = 'rgba(154,160,166,.65)'; dash = '3 4'; }

      const path = document.createElementNS(SVGNS, 'path');
      path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + (y1 + dy) + ', ' + x2 + ' ' + (y2 - dy) + ', ' + x2 + ' ' + y2);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', hot ? 'rgba(42,74,127,.7)' : stroke);
      path.setAttribute('stroke-width', hot ? '1.6' : '1');
      if (dash) path.setAttribute('stroke-dasharray', dash);
      elSvg.appendChild(path);

      if (!drewDot){
        const dot = document.createElementNS(SVGNS, 'circle');
        dot.setAttribute('cx', String(x1));
        dot.setAttribute('cy', String(y1));
        dot.setAttribute('r', hot ? '2.4' : '1.8');
        dot.setAttribute('fill', hot ? 'rgba(42,74,127,.8)' : stroke);
        elSvg.appendChild(dot);
        drewDot = true;
      }
    });
  });
}
// 語が割れる 0.55s の間、テザーを追従させる
function animateTethers(ms){
  const end = performance.now() + ms;
  const loop = () => {
    drawTethers();
    if (performance.now() < end) requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
let resizeT = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { equalizeCardHeights(); drawTethers(); }, 120);
});

/* =========================================================================
   (f) コンパイル — 本文の組み立てはクライアント側決定論。LLMは根拠文のみ。
   ========================================================================= */
elCompile.addEventListener('click', compile);

async function compile(){
  elCompile.disabled = true;
  // 分岐0件(完全指定ブリーフ)は対照デモの見せ場。/api/compile は decisions が空だと
  // 必ず ok:false を返すので、呼ばずにそのままコンパイル画面へ進める。
  // 根拠文は元々1件も存在しないため、エラー文言だけが出る呼び出しに意味がない。
  if (S.branches.length === 0){
    S.rationales = {};
    S.compileError = '';
    S.compileMs = 0;
    S.compileTiming = null;
    showCompiled();
    return;
  }
  const t0 = performance.now();
  let ticking = true;
  const tick = () => {
    if (!ticking) return;
    elCompile.textContent = 'コンパイル中… ' + ((performance.now() - t0) / 1000).toFixed(1) + 's';
    requestAnimationFrame(tick);
  };
  tick();

  const decisions = S.branches.map((b, bi) => {
    const d = S.decisions[bi];
    const o = {
      question_point: String(b.question_point || ''),
      anchor_words: Array.isArray(b.anchor_words) ? b.anchor_words.map(String) : [],
      status: d.status === 'decided' ? 'decided' : 'delegated'
    };
    if (d.status === 'decided'){
      const opt = (Array.isArray(b.options) ? b.options : [])[d.oi] || {};
      o.chosen_label = String(opt.label || '');
      const st = (S.renders[bi] || [])[d.oi];
      if (st && st.state === 'ok') o.chosen_tokens = st.tokens;
    }
    return o;
  });

  const r = await postJSON(API.compile, {brief: S.brief, decisions: decisions});
  ticking = false;
  S.compileMs = performance.now() - t0;

  if (r.err || !r.j || r.j.ok !== true){
    S.rationales = {};
    S.compileError = r.err || (r.j && r.j.error) || '根拠文の生成に失敗しました';
  }else{
    S.rationales = (r.j.rationales && typeof r.j.rationales === 'object') ? r.j.rationales : {};
    S.compileTiming = r.j.timing || null;
    S.compileError = '';
  }
  showCompiled();
}

function tokensLine(t){
  if (!t) return '';
  const pal = normPalette(t.palette);
  const parts = [
    'パレット ' + pal.join(' / '),
    '見出し=' + String(t.heading_font || '-'),
    '密度=' + String(t.density || '-'),
    '角=' + String(t.corner || '-')
  ];
  return parts.join('、');
}

function buildMarkdown(){
  const L = [];
  const decided = [], delegated = [];
  S.branches.forEach((b, bi) => {
    ((S.decisions[bi] && S.decisions[bi].status === 'decided') ? decided : delegated).push(bi);
  });

  L.push('# コンパイル済みブリーフ');
  L.push('');
  L.push('## 発注者が書いた唯一の文');
  L.push('');
  L.push('> ' + S.brief.replace(/\n/g, '\n> '));
  L.push('');
  L.push('- あなたがタイプした文字(最初の一文以降): ' + S.typedAfter);
  L.push('- あなたの選択: ' + S.branches.length);
  // 逐次配信では「沈黙」= 送信から最初のカードが出るまで。全判断点の確定はその後も続く。
  // 2つの実測値を別物として並べる(片方だけを見せて速く見せない)。
  if (S.allBranchesMs != null){
    L.push('- 沈黙(送信→最初の判断点, 実測・x1.0): ' + (S.silenceMs / 1000).toFixed(1) + '秒');
    L.push('- 全判断点の確定まで(実測・x1.0): ' + (S.allBranchesMs / 1000).toFixed(1) + '秒');
  }else{
    L.push('- 抽出の沈黙(実測・x1.0): ' + (S.silenceMs / 1000).toFixed(1) + '秒');
  }
  L.push('');

  if (S.branches.length === 0){
    L.push('## 判断点');
    L.push('');
    L.push('抽出された判断点は 0 件。このブリーフは十分に特定されている。');
    L.push('');
  }

  if (decided.length){
    L.push('## 決めた判断点');
    L.push('');
    decided.forEach(bi => {
      const b = S.branches[bi];
      const d = S.decisions[bi];
      const opt = (Array.isArray(b.options) ? b.options : [])[d.oi] || {};
      const st = (S.renders[bi] || [])[d.oi];
      L.push('### ' + String(b.question_point || ''));
      L.push('');
      L.push('- 選択: ' + String(opt.label || ''));
      if (opt.thumbnail_description) L.push('- 見え方: ' + String(opt.thumbnail_description));
      L.push('- 原文の根拠語: ' + (Array.isArray(b.anchor_words) ? b.anchor_words.map(a => '「' + a + '」').join(' ') : ''));
      if (st && st.state === 'ok'){
        L.push('- 視覚トークン: ' + tokensLine(st.tokens));
        if (st.tokens && st.tokens.tone_sample) L.push('- トーン例: ' + String(st.tokens.tone_sample).replace(/\n/g, ' '));
      }
      if (b.downstream_impact) L.push('- 未解決なら壊れるもの: ' + String(b.downstream_impact));
      const ra = S.rationales[b.question_point];
      if (ra) L.push('- 意図: ' + String(ra));
      L.push('');
    });
  }

  if (delegated.length){
    L.push('## 委ねた判断点(制作者の裁量)');
    L.push('');
    delegated.forEach(bi => {
      const b = S.branches[bi];
      L.push('### ' + String(b.question_point || ''));
      L.push('');
      L.push('- 委任: 制作者の裁量に委ねる');
      L.push('- 原文の根拠語: ' + (Array.isArray(b.anchor_words) ? b.anchor_words.map(a => '「' + a + '」').join(' ') : ''));
      if (b.default_if_unresolved) L.push('- 既定解: ' + String(b.default_if_unresolved));
      if (b.downstream_impact) L.push('- 未解決なら壊れるもの: ' + String(b.downstream_impact));
      const ra = S.rationales[b.question_point];
      if (ra) L.push('- 意図: ' + String(ra));
      L.push('');
    });
  }

  L.push('## 残存曖昧度');
  L.push('');
  L.push(S.assessment || '(評価なし)');
  L.push('');
  L.push('## 発注者からの提供が必要な材料');
  L.push('');
  if (S.missing.length) S.missing.forEach(m => L.push('- ' + m));
  else L.push('- (なし)');
  L.push('');
  L.push('---');
  L.push('');
  L.push('このブリーフは、上の1文と ' + S.branches.length + ' 回の選択だけから GYAKUMON が機械的に組み立てた。');
  L.push('本文の文言は発注者の原文と選択ラベルに由来する。AIが生成したのは各「意図」の1文のみ。');
  if (S.compileError) L.push('注: 意図の生成に失敗した(' + S.compileError + ')。本文は選択だけから組み立てられている。');
  return L.join('\n');
}

function buildJSON(){
  const obj = {
    format: 'gyakumon.compiled_brief.v0',
    source_brief: S.brief,
    compiled_at: new Date().toISOString(),
    evidence: {
      typed_characters_after_brief: S.typedAfter,
      choice_count: S.branches.length,
      // 逐次配信では silence = 送信→最初の判断点、all_branches = 送信→全判断点の確定。
      // 一括経路では all_branches は null(区別が存在しない)。
      extraction_silence_ms: Math.round(S.silenceMs),
      extraction_all_branches_ms: (S.allBranchesMs != null) ? Math.round(S.allBranchesMs) : null,
      extraction_streamed: !!(S.explodeTiming && S.explodeTiming.streamed),
      extraction_timing: S.explodeTiming,
      compile_wall_ms: Math.round(S.compileMs),
      compile_timing: S.compileTiming,
      rationale_error: S.compileError || null
    },
    decisions: S.branches.map((b, bi) => {
      const d = S.decisions[bi];
      const rec = {
        question_point: String(b.question_point || ''),
        anchor_words: Array.isArray(b.anchor_words) ? b.anchor_words.map(String) : [],
        status: d.status === 'decided' ? 'decided' : 'delegated',
        chosen: null,
        default_if_unresolved: String(b.default_if_unresolved || ''),
        rationale: S.rationales[b.question_point] ? String(S.rationales[b.question_point]) : null
      };
      // downstream_impact はスリムスキーマには無い。来た場合だけ載せる(空文字を吐かない)。
      if (b.downstream_impact) rec.downstream_impact = String(b.downstream_impact);
      if (d.status === 'decided'){
        const opt = (Array.isArray(b.options) ? b.options : [])[d.oi] || {};
        const st = (S.renders[bi] || [])[d.oi];
        rec.chosen = {
          label: String(opt.label || ''),
          tokens: (st && st.state === 'ok') ? st.tokens : null
        };
        if (opt.thumbnail_description) rec.chosen.thumbnail_description = String(opt.thumbnail_description);
      }
      return rec;
    }),
    residual_ambiguity_assessment: S.assessment,
    missing_materials: S.missing
  };
  return JSON.stringify(obj, null, 2);
}

let outMode = 'md';
function showCompiled(){
  elStage.hidden = true;
  elCompiled.hidden = false;
  $('numTyped').textContent = String(S.typedAfter);
  $('numChoice').textContent = String(S.branches.length);
  const note = [];
  note.push('本文の組み立てはブラウザ側の決定論処理。AIが書いたのは各判断点の「意図」1文のみ。');
  note.push('抽出の沈黙 ' + (S.silenceMs / 1000).toFixed(1) + '秒(x1.0 実測) / コンパイル ' + (S.compileMs / 1000).toFixed(1) + '秒。');
  if (S.compileError) note.push('意図の生成は失敗した: ' + S.compileError);
  $('compileNote').textContent = note.join(' ');
  paintOut();
}
function paintOut(){
  $('out').textContent = (outMode === 'md') ? buildMarkdown() : buildJSON();
  $('tabMd').setAttribute('aria-selected', String(outMode === 'md'));
  $('tabJson').setAttribute('aria-selected', String(outMode === 'json'));
}
$('tabMd').addEventListener('click', () => { outMode = 'md'; paintOut(); });
$('tabJson').addEventListener('click', () => { outMode = 'json'; paintOut(); });
$('btnCopy').addEventListener('click', async () => {
  const text = $('out').textContent;
  const btn = $('btnCopy');
  // 127.0.0.1 はセキュアコンテキストなので navigator.clipboard が使える。
  // execCommand フォールバックは「2つ目の入力要素が一瞬 DOM に載る」ため置かない(条項1)。
  try{
    await navigator.clipboard.writeText(text);
    btn.textContent = 'コピーした';
  }catch(e){
    btn.textContent = 'コピー失敗';
  }
  setTimeout(() => { btn.textContent = 'コピー'; }, 1600);
});
$('btnRestart').addEventListener('click', () => location.reload());

/* =========================================================================
   (g) 並置証明 SplitCompare
   左右とも app/compare/ の事前生成物。ここでは生成しない(開示: DISCLOSURE #7)。
   iframe の src はボタンを押した時に初めて入れる(コンパイル画面までは1バイトも読まない)。
   ========================================================================= */
const COMPARE = { raw: 'compare/raw.html', compiled: 'compare/compiled.html',
                  manifest: 'compare/manifest.json' };
let compareLoaded = false;

async function paintCompareNote(){
  const el = $('compareNote');
  el.textContent = '事前生成物(実生成・manifest付き)。左右は同一モデル・同一 effort。';
  try{
    const r = await fetch(COMPARE.manifest, {cache:'no-store'});
    if (!r.ok) return;
    const m = await r.json();
    const v = (m.verification && m.verification.compiled) || {};
    const t = m.timings || {};
    const bits = ['事前生成物(実生成・manifest付き)。左右は同一モデル(' + (m.engine && m.engine.model) +
                  ')・同一 effort(' + (m.engine && m.engine.effort) + ')。'];
    if (typeof v.traced === 'number'){
      bits.push('右のHTMLに埋まった選択の痕跡: ' + v.traced + '/' + v.of + '(左は 0/' + v.of + ')。');
    }
    if (t.raw_lp && t.compiled_lp){
      bits.push('生成 API 実時間 左 ' + (t.raw_lp.api_ms/1000).toFixed(1) + '秒 / 右 ' +
                (t.compiled_lp.api_ms/1000).toFixed(1) + '秒。');
    }
    if (m.generated_at) bits.push('生成 ' + m.generated_at + '。');
    el.textContent = bits.join(' ');
  }catch(e){ /* manifest が読めなくても並置自体は成立する */ }
}

$('btnCompare').addEventListener('click', () => {
  if (!compareLoaded){
    $('frameRaw').src = COMPARE.raw;
    $('frameCompiled').src = COMPARE.compiled;
    compareLoaded = true;
    paintCompareNote();
  }
  elCompiled.hidden = true;
  $('screenCompare').hidden = false;
  window.scrollTo(0, 0);
});
$('btnCompareBack').addEventListener('click', () => {
  $('screenCompare').hidden = true;
  elCompiled.hidden = false;
  window.scrollTo(0, 0);
});

autoGrow();
elInput.focus();
